<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tutto nel palmo della Tua mano. I migliori artigiani e professionisti per ogni tua esigenza." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>CercArtigiano</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T971GCKV7Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-T971GCKV7Y');
    </script>

    <script>
      // Force unregister of old Service Workers which might be intercepting missing files.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered to fix cache issues.');
          }
        }).catch(function(err) {
          console.log('Service Worker unregistration failed: ', err);
        });
      }
      
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // Some polyfills try to overwrite window.fetch which is a getter in some environments.
      try {
        if (window.fetch && !Object.getOwnPropertyDescriptor(window, 'fetch').set) {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => { console.warn('Prevented overwriting window.fetch'); },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.error('Failed to apply fetch fix:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="debug-check" style="position:fixed;bottom:0;right:0;font-size:10px;color:rgba(29,29,31,0.05);pointer-events:none;">v1.0.2</div>
    <script>
      window.addEventListener('error', function(e) {
        // Ignore benign Vite WebSocket errors and other known non-critical errors
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('cross-origin'))) return;
        
        fetch('/api/log', { 
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify({ 
            type: 'runtime',
            error: e.message, 
            stack: e.error ? e.error.stack : null
          }) 
        }).catch(() => {});
      });
      window.addEventListener('unhandledrejection', function(e) {
        // Ignore benign Vite WebSocket errors and empty rejections
        const reasonStr = e.reason ? (e.reason.message || e.reason.toString()) : '';
        if (reasonStr.includes('WebSocket') || reasonStr.includes('cross-origin')) return;
        if (!e.reason) return;

        fetch('/api/log', { 
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify({ 
            type: 'unhandled_rejection',
            error: reasonStr,
            stack: e.reason ? e.reason.stack : null
          }) 
        }).catch(() => {});
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
